
services:
  paperclip:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    pids_limit: 2048
    stop_grace_period: 90s

    expose:
      - "3100"

    environment:
      HOST: "0.0.0.0"
      PAPERCLIP_HOME: "/paperclip"

      PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "public"

      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL}"
      PAPERCLIP_AUTH_PUBLIC_BASE_URL: "${PAPERCLIP_PUBLIC_URL}"
      PAPERCLIP_ALLOWED_HOSTNAMES: "${PAPERCLIP_ALLOWED_HOSTNAMES}"

      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?required}"
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: "${PAPERCLIP_TOOL_ACTION_SIGNING_SECRET:?required}"

    volumes:
      - paperclip-data:/paperclip

volumes:
  paperclip-data:
