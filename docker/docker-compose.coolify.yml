services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?required}"
      POSTGRES_DB: paperclip
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 5s
      timeout: 5s
      retries: 30

  paperclip:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    pids_limit: 2048
    stop_grace_period: 90s

    expose:
      - "3100"

    environment:
      HOST: "0.0.0.0"
      PAPERCLIP_HOME: "/paperclip"

      NODE_EXTRA_CA_CERTS: "/etc/omniclinic-tls/ca.crt"

      DATABASE_URL: "postgresql://paperclip:${POSTGRES_PASSWORD}@db:5432/paperclip"

      PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "public"
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL}"
      PAPERCLIP_AUTH_PUBLIC_BASE_URL: "${PAPERCLIP_PUBLIC_URL}"
      PAPERCLIP_ALLOWED_HOSTNAMES: "${PAPERCLIP_ALLOWED_HOSTNAMES:-}"

      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?required}"
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: "${PAPERCLIP_TOOL_ACTION_SIGNING_SECRET:?required}"

    volumes:
      - paperclip-data:/paperclip
      - /opt/data/omniclinic-hermes-tls/ca.crt:/etc/omniclinic-tls/ca.crt:ro

    depends_on:
      db:
        condition: service_healthy
      hermes-tls:
        condition: service_started

    networks:
      - default

  hermes-tls:
    image: caddy:2.11.9-alpine
    restart: unless-stopped

    volumes:
      - /opt/data/omniclinic-hermes-tls/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/data/omniclinic-hermes-tls/server.crt:/etc/caddy/certs/server.crt:ro
      - /opt/data/omniclinic-hermes-tls/server.key:/etc/caddy/certs/server.key:ro

    networks:
      - default
      - hermes_private

volumes:
  pgdata:
  paperclip-data:

networks:
  hermes_private:
    external: true
    name: ig4k8cw40g0ogo40wso04sog
